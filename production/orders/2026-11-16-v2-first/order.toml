# The first v2 order: 5 PCBs of each board with 2 assembled by JLC (the smallest assembled run), and the sheet-metal
# housing and optic carriers for 5 lamps from JLCCNC and JLC3DP, all in one JLC cart. Written by hand (or by Claude when
# told what happened); `pcbkit production` makes ORDER.md and upload/ from it. Add an [[event]] for each step: status =
# draft, submitted, in-production, shipped, received, problem or cancelled; order_no, price and currency once known.
title = "driver v2.2 and LED board v2.0, 2 of each assembled, with the round-7 housing for 5 lamps"
house = "jlcpcb"
fab = [
  "LED board: aluminium, 1 layer, 1.6 mm, 1 oz, 1 W/mK (the only conductivity JLC offers on 1-layer aluminium), 3000 V, white mask, black silkscreen, HASL with lead, JLC's mark removed, single PCBs",
  "LED board PCBA: Standard (Economic is not offered on aluminium), top side, 2 of 5 assembled, JLC's edge rails added (the board is under 70 mm), Confirm Parts Placement yes; assembly remark: 'LED1-LED3 (HD2525): cathode = pad 1, the side away from the package dot. The + on the silk marks the anode.'",
  "LED board BOM: 3/3 matched by LCSC number; JLC left LED3 (blue, C49237860) unticked at quantity 0 with 'The processing of this component is difficult', reviewed after ordering and charged extra only if an advanced option is needed. Ticked by hand",
  "Driver: FR4, 2 layers, 1.6 mm, 1 oz, green mask, white silkscreen, HASL with lead (JLC now defaults to OSP), tented vias, JLC's default 0.3 mm via option (all 69 vias are 0.3 mm drills), JLC's mark removed. PCB remark: the JLCJLCJLCJLC text on the bottom silk is an old order-number placeholder, to be left off",
  "Driver PCBA: Economic, top side, 2 of 5 assembled, JLC's tooling holes, Confirm Parts Placement yes, nitrogen reflow (Economic default); files are the -front pair from `pcbkit fab` on the board as released (v2.2 from 2026-11-16) (the release's CPL less J1/J2, which sit on the back). J3 (JST PH 6, through-hole) placed by JLC: hand-soldering fee $3.61 and manual assembly $0.20",
  "Placement preview, checked part by part against the releases' PLACEMENT-*-jlcpcb.md: U2-U5 (^SOT-89, never checked before), U1/U6 (SOIC), D1-D4 right, and D5 (v2.1, D_SOD-323, no rule) right. Turned by hand: U7 (74AHCT1G125, C350557) one Rotate Left, as the never-checked ^SOT-353 (+180) left it a quarter turn out; LED2 and LED3 (green C49237859, blue C49237860) half a turn, as JLC draws them opposite the red (C49237857) on the same footprint. pcb-kit's table is fixed on branch jlc-rotations-spotlight",
  "Housing: JLCCNC sheet metal, Al 5052, black matte powder coat on shell, cap, hood, doors and yoke, plate/fins/spacers bare; the plate's 10 x M3 threads (mech/housing/order6/rgb-spotlight-plate-threads.pdf) and the cap's 4 press nuts, round 7: 2 x PEM S-M3-2, 2 x S-M4-2 (mech/housing/order7/rgb-spotlight-cap-press-nuts.pdf) by drawing, priced after JLCCNC's review. Round 7 (DESIGN D30) changes only the shell, cap and yoke (mech/housing/order7/); the other parts are round 6's (order6/). Carriers: JLC3DP MJF PA12-HP, dyed black",
  "Customs: boards 'Research/Education/DIY, DIY - HS 902300'; sheet metal HS 761699; carriers 'Plastic Bracket' HS 392690",
]
notes = [
  "LED polarity: settled on a v1 board on 2026-11-16. The user's diode test lit v1's LED1 (C49237857) with + on the L1 pad (pad 2) and - on the R1 pad (pad 1, GND side): pad 1 is the cathode, as the v2 footprint and D19's silk have it. All three datasheets (XL-HD2525SURC/UGC/UBC-A4) draw pad 1 as the cathode and the package dot by pad 2.",
  "Smallest assembled run: 2 of each board. Five lamps need 5 assembled of each; the remaining PCBs can be assembled in a second order once the first two have passed bring-up.",
  "Hand assembly: J1/J2 (JST B3B-XH-A, back of the driver) on both assembled drivers. Snap JLC's edge rails off the LED boards.",
  "Housing quotes need JLCCNC's manual review (2-4 h): the threads and press nuts are not in the cart prices yet.",
]

